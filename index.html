  }
}

<!-- sameAs (SNSリンク) は profile/profile.json の links から app.js が注入する -->

<!-- Apply stored theme before render to prevent flash -->
<script>
  (function(){
    var s=localStorage.getItem('theme');
    if(!s){s=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';}
    document.documentElement.setAttribute('data-theme',s);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Fixed controls: lang switch + theme toggle -->
<div class="fixed-controls">
  <nav class="lang-switch" aria-label="言語切り替え">
    <span class="lang-btn active">JA</span>
    <a class="lang-btn" href="en/">EN</a>
  </nav>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="テーマ切り替え">🌙</button>
</div>

<!-- BibTeX Modal -->
<div class="modal-overlay" id="bibtexModal" onclick="closeBibtexModal(event)">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">BibTeX</span>
      <button class="modal-close" onclick="document.getElementById('bibtexModal').classList.remove('open')">×</button>
    </div>
    <div class="modal-body"><pre class="bibtex-code" id="bibtexContent"></pre></div>
    <div class="modal-footer">
      <button class="copy-btn" id="copyBtn" onclick="copyBibtex()">コピー</button>
    </div>
  </div>
</div>

<!-- Header -->
<header class="header-wrap">
  <div class="header-bg-fallback"></div>
  <div class="header-bg"></div>
  <div class="header-content">
    <div class="face-photo" role="img" aria-label="プロフィール写真"></div>
    <div class="header-name">
      <h1><span id="profileNameMain">…</span><span class="name-sub" id="profileNameSub"></span></h1>
      <div class="affiliation" id="profileAffiliations"></div>
      <div class="header-sns" id="profileSns"></div>
    </div>
    <div class="header-recent-wrap">
      <span class="recent-label" id="recentLabelEl"></span>
      <div class="header-recent" id="qrContainer"></div>
    </div>
  </div>
</header>

<!-- Main -->
<main class="main" id="mainContent">
  <!-- スケルトン: JS がデータを取得するまでのプレースホルダー -->
  <div class="skeleton-card" aria-hidden="true"><div class="sk-bar sk-title"></div><div class="sk-bar w85"></div><div class="sk-bar w60"></div></div>
  <div class="skeleton-card" aria-hidden="true"><div class="sk-bar sk-title"></div><div class="sk-bar w85"></div><div class="sk-bar w60"></div></div>
  <div class="skeleton-card" aria-hidden="true"><div class="sk-bar sk-title"></div><div class="sk-bar w60"></div></div>
</main>

</noscript>

<script src="js/lang/ja.js"></script>
<script src="js/app.js"></script>
<script>initPage('ja', '');</script>
</body>
</html>

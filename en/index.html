<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<!-- /en/ は旧 URL。英語版はサイトルート (/) に移動したため、ここは転送専用。
     GitHub Pages はサーバー側リダイレクトを持たないので JS + meta refresh で転送する。
     JS が動く環境では #hash も引き継ぐ (例: /en/#sec-research → /#sec-research)。 -->
<link rel="canonical" href="https://pakapaka333.github.io/">
<script>location.replace('../' + location.search + location.hash);</script>
<meta http-equiv="refresh" content="0; url=../">
<title>Redirecting…</title>
</head>
<body>
<p>This page has moved to <a href="../">https://pakapaka333.github.io/</a>.</p>
</body>
</html>
